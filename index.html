<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Planificador de tareas</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container mt-4">
      <div class="container-box">
        <div class="top-bar mb-3">
          <h4>PLANIFICADOR DE TAREAS</h4>
          <div>
            <button id="btnFecha" class="btn btn-outline">📅 Hoy</button>
            <input type="date" id="calendario" style="display: none" />
            <button class="btn btn-outline-primary">👤 Perfil</button>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-md-4">
            <div class="stats">
              <p>TAREAS TOTALES</p>
              <h3 id="total">0</h3>
            </div>
          </div>
          <div class="col-md-4">
            <div class="stats">
              <p>EN PROCESO</p>
              <h3 id="proceso">0</h3>
            </div>
          </div>
          <div class="col-md-4">
            <div class="stats">
              <p>COMPLETADAS</p>
              <h3 id="completadas">0</h3>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-md-4">
            <div class="form-box">
              <h5>AGREGAR NUEVA TAREA</h5>

              <form id="form">
                <input
                  type="text"
                  id="titulo"
                  class="form-control mb-2"
                  placeholder="Título"
                />

                <textarea
                  id="descripcion"
                  class="form-control mb-2"
                  placeholder="Descripción"
                ></textarea>

                <label>📅 Fecha de inicio</label>
                <input type="date" id="fechaInicio" class="form-control mb-2" />
                <label>🏁 Fecha de finalización</label>
                <input type="date" id="fechaFin" class="form-control mb-2" />

                <select id="estado" class="form-control mb-2">
                  <option value="Pendiente">Pendiente</option>
                  <option value="En proceso">En proceso</option>
                  <option value="Completada">Completada</option>
                </select>

                <label>Prioridad</label>

                <select id="prioridad" class="form-control mb-2">
                  <option value="Alta">Alta</option>
                  <option value="Media">Media</option>
                  <option value="Baja">Baja</option>
                </select>

                <button class="btn btn-outline w-100">+ AGREGAR TAREA</button>
              </form>

              <div id="error" class="text-danger mt-2"></div>
            </div>
          </div>

          
            <div class="col-md-8">
              <h5>LISTA DE TAREAS</h5>
              <div id="lista"></div>
            </div>
            
            </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="app.js"></script>
  </body>
</html>
